[workspace]
members = [
    "crates/protoevo-core",
    "crates/protoevo-compute",
    "crates/protoevo-render",
    "crates/protoevo-app",
]
resolver = "2"

[workspace.dependencies]
# Physics
rapier2d = "0.19"

# GPU Compute & Rendering
wgpu = "0.20"
bytemuck = { version = "1.14", features = ["derive"] }

# Game Engine (choose one)
bevy = { version = "0.14", default-features = false, features = ["bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_winit"] }

# Math
glam = "0.27"
nalgebra = "0.32"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Utilities
rand = "0.8"
rayon = "1.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1  # Some optimization for faster dev builds
